<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- 아이콘: 블록 쌓기 형태 -->
  <!-- 
    ㅁ
    ㅁ ㅁ+
  -->
  <g fill="none">
    <!-- 상단 왼쪽 블록 -->
    <rect x="8" y="8" width="14" height="14" rx="2" fill="#60A5FA"/>
    <!-- 하단 왼쪽 블록 -->
    <rect x="8" y="26" width="14" height="14" rx="2" fill="#3B82F6"/>
    <!-- 하단 오른쪽 블록 (플러스) - 하단 왼쪽과 같은 높이 -->
    <rect x="26" y="26" width="14" height="14" rx="2" fill="#2563EB"/>
    <!-- 플러스 표시 -->
    <path d="M33 30 L33 36 M30 33 L36 33" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- 텍스트: BuildOn -->
  <text x="52" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    <tspan fill="#1E293B">Build</tspan><tspan fill="#3B82F6">On</tspan>
  </text>
</svg>