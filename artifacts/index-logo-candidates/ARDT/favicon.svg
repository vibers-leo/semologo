<?xml version="1.0" encoding="UTF-8"?>
<!-- ARDT site icon.

     The glyph is the burst rupture disk from the ARDT logo - the green element that sits in
     the bowl of the "d" in ardt-mark-dark.svg - lifted as EXACT path data, not redrawn. Its
     box was measured with getBBox in a real browser (x 289.41, y 90.66, w 121.62, h 132.01),
     which is why the viewBox below is in the logo's own coordinate space rather than a tidy
     0 0 64 64: keeping the coordinates means the icon and the header logo can never drift.

     It replaces a hand-drawn predecessor that stood the same element UPRIGHT and made it
     symmetric. That version was derived from the logo too, but a dome directly above a small
     circle on a vertical stem is the map-pin gestalt, and it read as a map marker to everyone
     who saw it. The logo's element is diagonal and asymmetric, which is what stops that.

     White knocked out of a brand-green tile, because at 16px an outline glyph on a transparent
     ground has too little mass to find in a crowded tab strip. Green is the LOGO green
     (#abce37), not the CSS custom property named color-accent (#8DC63F); they differ, and as a brand
     asset this one follows the logo.

     NOTE: no "- -" (without the space) anywhere in this comment - a double hyphen is
     illegal inside an XML comment and silently makes the whole file unparseable.

     Rounded corners are correct here and WRONG for apple-touch-icon.png, which iOS masks
     itself - that file is deliberately full-bleed and square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="257.81 64.26 184.81 184.81">
  <rect x="257.81" y="64.26" width="184.81" height="184.81" rx="33.27" fill="#abce37"/>
