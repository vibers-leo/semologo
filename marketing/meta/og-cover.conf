# OG 커버 설정 — 세모로고
#
# 배경은 히어로 사진이 아니라 **실제 로고 48개를 깐 그리드**다.
# 세모로고는 흰 그리드 사이트라 히어로 사진이 없고, 로고가 잔뜩 깔린 그림
# 자체가 "4만 개"를 눈으로 증명한다. 배경 생성: /tmp/og-grid.html (재생성 가능)

BG_IMAGE="/tmp/og-bg2.png"

# ⚠️ 숫자는 반올림 + '이상'으로 쓴다. 이미지에 박히는 숫자는 늙는다 —
#    '40,274개'는 내일 틀리지만 '40,000개 이상'은 계속 참이다(브랜드는 늘기만 한다).
EYEBROW="40,000개 이상의 브랜드 로고"
SUBTEXT="SVG·PNG 무료 다운로드. 심볼·워드마크까지 형태별로."
DOMAIN="semologo.com"

LOGO_IMAGE="/Users/juuuno/Desktop/macminim4/brand-logos/_clients/semologo/logo-white.png"
WORDMARK="세모로고"
LOGO_HEIGHT="92px"

# 세모로고는 무채색 브랜드다(globals.css: #111 / #f7f7f7).
BRAND="#111111"        # 도메인 배지 바탕
BRAND_DARK="#0a0a0a"   # 어둠 막
BRAND_LIGHT="#facc15"  # 눈썹 — 흑백 배경에서 숫자가 튀어야 한다

BG_BLUR="0px"          # 우리가 만든 원본이라 선명하다
