name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify brand CDN
        run: pnpm check:cdn
        env:
          NEXT_PUBLIC_CDN_URL: https://logo.vibers.co.kr/_clients

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_CDN_URL: https://logo.vibers.co.kr/_clients
          NEXT_PUBLIC_APP_URL: https://semologo.com
          NEXT_PUBLIC_ADSENSE_ID: ca-pub-7704550771011130
          # 쿠팡 파트너스 — 가입 후 위젯 생성하면 나오는 두 값.
          # 페이지 소스에 그대로 노출되는 공개값이라 시크릿이 아니다.
          # 비워두면 CoupangSlot 이 아무것도 렌더하지 않는다.
          NEXT_PUBLIC_COUPANG_WIDGET_ID: ${{ vars.COUPANG_WIDGET_ID }}
          NEXT_PUBLIC_COUPANG_TRACKING_CODE: ${{ vars.COUPANG_TRACKING_CODE }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Add CNAME
        run: echo "semologo.com" > out/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
